<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Weekly Results - Boats And Bros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap">
<style>:root{
 --paper:#EEF1F7; --card:#FFFFFF; --ink:#0A1020; --ink2:#37425C; --mute:#6B7794;
 --rule:#C9D3E3; --rule2:#E3E9F3; --band:#0A1020; --panel2:#F4F7FC;
 --amber:#8A5A00; --amber-bg:#FBEECE; --blue:#0B4DA2; --blue-bg:#D9E7FB;
 --onblue:#FFFFFF; --onamber:#FFFFFF;
 --shadow:0 1px 2px rgba(10,16,32,.06),0 8px 26px rgba(10,16,32,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --paper:#080C16; --card:#121A2B; --ink:#EEF2FA; --ink2:#BCC7DC; --mute:#8593AD;
 --rule:#243149; --rule2:#1A2438; --band:#050912; --panel2:#0F1727;
 --amber:#F0B650; --amber-bg:#3B2C0E; --blue:#6FA5F5; --blue-bg:#152744;
 --onblue:#08101F; --onamber:#241905;
 --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
 --paper:#080C16; --card:#121A2B; --ink:#EEF2FA; --ink2:#BCC7DC; --mute:#8593AD;
 --rule:#243149; --rule2:#1A2438; --band:#050912; --panel2:#0F1727;
 --amber:#F0B650; --amber-bg:#3B2C0E; --blue:#6FA5F5; --blue-bg:#152744;
 --onblue:#08101F; --onamber:#241905;
 --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 26px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
 font-family:Lato,-apple-system,Segoe UI,sans-serif;font-size:16px;line-height:1.55;
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 70px}
.band+.wrap{padding-top:26px}
.band{background:var(--band);color:#F2F0EC}
.nav{background:var(--band);border-bottom:1px solid rgba(255,255,255,.09)}
.nav .wrap{display:flex;gap:2px;padding:0 20px;overflow-x:auto}
.nav a{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:11.5px;
 font-weight:500;color:#96A0B4;text-decoration:none;padding:14px 15px;white-space:nowrap;
 border-bottom:2px solid transparent}
.nav a:hover{color:#F2F0EC}
.nav a.on{color:#F2F0EC;border-bottom-color:var(--amber)}
.nav a:focus-visible{outline:2px solid var(--amber);outline-offset:-4px}
.band .wrap.hero{padding-top:40px;padding-bottom:36px}
.kick{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.18em;font-size:12px;
 font-weight:500;color:var(--amber);margin:0 0 10px}
h1{font-family:Oswald,sans-serif;font-weight:700;font-size:clamp(32px,6vw,58px);line-height:1;
 margin:0;letter-spacing:-.01em;text-wrap:balance}
.dek{font-size:19px;line-height:1.5;color:#C9CEDA;max-width:68ch;margin:14px 0 0}
.dek b{color:#F2F0EC}
h2{font-family:Oswald,sans-serif;font-weight:600;font-size:13px;text-transform:uppercase;
 letter-spacing:.16em;color:var(--mute);margin:42px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
h3{font-family:Oswald,sans-serif;font-weight:600;font-size:22px;margin:0;letter-spacing:-.005em}
h4{font-family:Oswald,sans-serif;font-weight:600;font-size:11.5px;text-transform:uppercase;
 letter-spacing:.13em;color:var(--mute);margin:0 0 8px}
h4.mt{margin-top:18px}
a{color:var(--blue)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font-family:Oswald,sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.08em;
 font-size:10.5px;color:var(--mute);text-align:left;padding:0 10px 7px;white-space:nowrap;
 border-bottom:1px solid var(--rule)}
td{padding:8px 10px;border-bottom:1px solid var(--rule2)}
.num{text-align:right}th.num{text-align:right}
.b{font-weight:900}.dim{color:var(--mute)}
.pos{color:var(--blue);font-weight:700}.neg{color:var(--amber);font-weight:700}
.stand tbody tr:nth-child(odd){background:var(--rule2)}
.stand .rk{font-family:Oswald,sans-serif;font-weight:700;font-size:17px;width:34px;color:var(--mute)}
.stand .tm{font-weight:700;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:11px;padding:16px 18px;
 box-shadow:var(--shadow)}
.tile .lab{font-family:Oswald,sans-serif;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
 color:var(--mute)}
.tile .v{font-family:Oswald,sans-serif;font-weight:700;font-size:32px;line-height:1.1;margin-top:2px}
.tile .s{font-size:13px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;
 margin-bottom:16px;box-shadow:var(--shadow)}
.grade{font-family:Oswald,sans-serif;font-weight:700;font-size:15px;padding:3px 9px;border-radius:4px;
 display:inline-block;min-width:42px;text-align:center}
.gA{background:var(--blue);color:var(--onblue)}
.gB{background:var(--blue-bg);color:var(--blue)}
.gC{background:var(--amber-bg);color:var(--amber)}
.gD{background:var(--amber);color:var(--onamber)}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:11px;padding:28px 22px;
 text-align:center;color:var(--mute)}
.empty strong{display:block;font-family:Oswald,sans-serif;font-size:17px;color:var(--ink);
 text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
.cta{display:inline-block;font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.12em;
 font-size:11.5px;font-weight:500;background:var(--blue);color:var(--onblue);text-decoration:none;
 padding:10px 16px;border-radius:6px;margin-top:14px}
.cta:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media(max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.wrap{padding-left:14px;padding-right:14px}.card,.tile{padding:16px 14px}
 .band .wrap.hero{padding-top:28px;padding-bottom:26px}}
.pill{font-family:Oswald,sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;
 text-transform:uppercase;padding:4px 10px;border-radius:4px;background:var(--rule2);color:var(--mute)}
.pill.live{background:var(--blue-bg);color:var(--blue)}

.brand{display:flex;align-items:center;padding:0 13px 0 2px;flex:0 0 auto}
.brand img{display:block;width:22px;height:22px;border-radius:5px}
.brand:focus-visible{outline:2px solid var(--amber);outline-offset:-3px}
.tile.lnk{display:block;text-decoration:none;color:inherit;transition:border-color .12s}
.tile.lnk:hover{border-color:var(--blue)}
.tile.lnk:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tile .v2{font-family:Oswald,sans-serif;font-weight:600;font-size:20px;line-height:1.15;margin-top:3px}

.fold{background:var(--card);border:1px solid var(--rule);border-radius:11px;margin:12px 0;
 box-shadow:var(--shadow);overflow:hidden}
.fold>summary{font-family:Oswald,sans-serif;font-weight:600;font-size:13px;text-transform:uppercase;
 letter-spacing:.13em;color:var(--ink);padding:15px 20px;cursor:pointer;list-style:none;
 display:flex;align-items:center;gap:14px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'+';font-family:Oswald,sans-serif;font-weight:400;font-size:21px;
 color:var(--mute);line-height:1;margin-left:auto}
.fold[open]>summary::after{content:'\2212'}
.fold>summary:hover{color:var(--blue)}
.fold>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.fold>*:not(summary){padding:0 18px 18px}
.fold .empty{margin:0}

.game{border-bottom:1px solid var(--rule2)}
.game:last-of-type{border-bottom:none}
.game>summary{display:grid;grid-template-columns:1fr 58px 26px 58px 1fr;align-items:center;gap:8px;
 padding:11px 4px;cursor:pointer;list-style:none}
.game>summary::-webkit-details-marker{display:none}
.game>summary:hover{background:var(--rule2)}
.game>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.gt{font-weight:700;font-size:14.5px}
.gt.r{text-align:right}
.gs{font-family:Oswald,sans-serif;font-weight:700;font-size:16px;text-align:center;
 font-variant-numeric:tabular-nums}
.gv{text-align:center;font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.gbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding:4px 4px 16px}
@media(max-width:620px){.gbody{grid-template-columns:minmax(0,1fr)}
 .game>summary{grid-template-columns:1fr 50px 20px 50px 1fr;gap:5px}
 .gt{font-size:13px}.gs{font-size:14px}}
table.mini{font-size:13.5px}
table.mini td{padding:5px 7px;border-bottom:1px solid var(--rule2)}
table.mini td.l{color:var(--ink)}
table.mini tr.tot td{border-top:1px solid var(--rule);border-bottom:none;
 font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;
 color:var(--mute);padding-top:7px}
table.mini tr.tot td.num{font-family:Lato,sans-serif;font-size:15px;color:var(--ink);letter-spacing:0}

.rost .slot{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.1em;color:var(--mute);width:44px}
.rost .pp{font-family:Oswald,sans-serif;font-size:10.5px;letter-spacing:.06em;color:var(--mute);width:40px}



@media(max-width:520px){.fold>summary .sm{gap:11px;font-size:12.5px;margin-right:10px}}
.gs.win{color:var(--blue)}

.wk{background:var(--card);border:1px solid var(--rule);border-radius:12px;margin:0 0 14px;
 box-shadow:var(--shadow);overflow:hidden}
.wk>summary{padding:16px 20px;cursor:pointer;list-style:none;display:flex;align-items:baseline;
 flex-wrap:wrap;gap:6px 14px}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary:hover .wkh{color:var(--blue)}
.wk>summary:focus-visible{outline:2px solid var(--blue);outline-offset:-3px}
.wkh{font-family:Oswald,sans-serif;font-weight:600;font-size:22px;letter-spacing:-.005em}
.wkhi{font-size:14.5px;color:var(--ink2)}
.wkhi b{color:var(--ink)}
.wk>summary::after{content:'+';font-family:Oswald,sans-serif;font-weight:400;font-size:22px;
 color:var(--mute);line-height:1;margin-left:auto}
.wk[open]>summary::after{content:'\2212'}
.wkbody{padding:0 20px 8px}

.gbody1{padding:2px 0 14px}
table.h2h{font-size:14px;width:100%}
table.h2h td{padding:7px 8px;border-bottom:1px solid var(--rule2);vertical-align:middle}
.h2h .hn{color:var(--ink);font-weight:600}
.h2h .hn.r{text-align:right}
.h2h .hp{font-family:Oswald,sans-serif;font-weight:600;font-size:15px;width:56px;text-align:center;
 font-variant-numeric:tabular-nums;color:var(--mute)}
.h2h .hp{color:var(--mute);font-weight:500}
.h2h .hp.w{color:var(--ink);font-weight:700}
.h2h .hs{line-height:1.15;padding-top:5px;padding-bottom:5px}
.mg{display:block;font-family:Lato,sans-serif;font-size:10.5px;font-weight:700;letter-spacing:0;
 text-transform:none;color:var(--blue);margin-top:1px}
.h2h .hs{font-family:Oswald,sans-serif;font-size:10px;letter-spacing:.1em;color:var(--mute);
 text-align:center;width:52px;text-transform:uppercase}
.h2h tr.htot td{border-top:2px solid var(--ink);border-bottom:none;padding-top:9px}
.h2h tr.htot .hn{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;
 font-size:10.5px;color:var(--mute);font-weight:500}
.h2h tr.htot .hp{font-size:19px}
.h2h tr.htot .hp{color:var(--mute)}
.h2h tr.htot .hp.w{color:var(--blue);font-weight:700}
@media(max-width:560px){table.h2h{font-size:12.5px}.h2h .hn{font-size:12.5px}
 .h2h .hp{width:46px;font-size:13.5px}.h2h .hs{width:40px;font-size:9px}}

.fold>summary .tr{font-family:Oswald,sans-serif;font-weight:700;font-size:15px;color:var(--mute);
 min-width:22px;display:inline-block}


.fold>summary .tn{font-family:Oswald,sans-serif;font-weight:600;font-size:22px;
 text-transform:none;letter-spacing:-.005em;color:var(--ink)}
.fold>summary:hover .tn{color:var(--blue)}

.livehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 margin:0 0 14px}
.lhl{display:flex;align-items:center;gap:9px}
.lhr{font-style:italic;font-size:12.5px;color:var(--mute)}
.lhhi{margin-left:auto;display:inline-flex;align-items:center;gap:14px}
.lhl2{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;
 color:var(--mute)}
.lhn{font-size:15px;color:var(--ink)}
.lhp{font-family:Oswald,sans-serif;font-weight:600;font-size:17px;color:var(--ink);
 font-variant-numeric:tabular-nums}
@media(max-width:520px){.lhhi{gap:9px}.lhn{font-size:13.5px}.lhp{font-size:15px}}

.cards.nav2{margin-top:26px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.wkhi{display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap}
.wkn{font-size:15px}
.wkp{font-family:Oswald,sans-serif;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;
 color:var(--ink)}
.wkd{font-family:Oswald,sans-serif;font-weight:600;font-size:13px;color:var(--blue);
 background:var(--blue-bg);padding:2px 9px;border-radius:4px}
@media(max-width:520px){.wkhi{gap:9px}.wkn,.wkp{font-size:14px}}

.rost tbody tr:nth-child(odd){background:var(--rule2)}
.rost tbody tr.sep{background:var(--band)}
.rost tbody tr.sep td{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.13em;
 font-size:10px;color:var(--mute);padding:6px 10px;border-bottom:1px solid var(--rule)}
.rost tbody tr.sep+tr{background:transparent}

table.h2h tbody tr:nth-child(odd){background:var(--rule2)}
table.h2h tbody tr.htot{background:transparent}

.game>summary{padding:13px 8px}
.gt{font-size:16px;font-weight:900;letter-spacing:-.01em}
.gs{font-size:20px}
.gs.win{color:var(--blue)}
.game[open]>summary{background:var(--panel2);border-bottom:2px solid var(--ink)}

/* tables sit on white so the zebra actually steps; the page ground was too close to it */
.wrap > .scroll, .wrap > h2 + .scroll{background:var(--card);border:1px solid var(--rule);
 border-radius:11px;box-shadow:var(--shadow);padding:4px 6px 6px}
.wrap > .scroll table{width:100%}
.stand tbody tr:nth-child(odd){background:#E7EDF7}
.rost tbody tr:nth-child(odd){background:#E7EDF7}
table.h2h tbody tr:nth-child(odd){background:#E7EDF7}
.stand tbody tr td{border-bottom:1px solid var(--rule2)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .stand tbody tr:nth-child(odd),
 :root:not([data-theme="light"]) .rost tbody tr:nth-child(odd),
 :root:not([data-theme="light"]) table.h2h tbody tr:nth-child(odd){background:#182237}}
:root[data-theme="dark"] .stand tbody tr:nth-child(odd),
:root[data-theme="dark"] .rost tbody tr:nth-child(odd),
:root[data-theme="dark"] table.h2h tbody tr:nth-child(odd){background:#182237}

.fold>summary .sma{font-family:Lato,sans-serif;font-weight:400;font-size:14.5px;letter-spacing:0;
 text-transform:none;color:var(--ink2);font-variant-numeric:tabular-nums}
.fold>summary .tr{font-size:17px}
@media(max-width:520px){.fold>summary .tn{font-size:18px}.fold>summary{gap:9px;padding:13px 14px}}

/* the rank td had a width but its th did not, so the Team header sat left of the names */
.stand thead th:first-child{width:34px}
.rost thead th:first-child{width:44px}
