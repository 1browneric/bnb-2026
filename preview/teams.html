<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#060E1A">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Boats And Bros">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="site.webmanifest">
<title>Teams - Boats And Bros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://api.sleeper.app" crossorigin>
<link rel="preconnect" href="https://site.api.espn.com" crossorigin>
<link rel="preconnect" href="https://sleepercdn.com" crossorigin>
<link rel="preconnect" href="https://a.espncdn.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>/* BOATS AND BROS - the Fantasy Hub design system.
   Navy field chrome, white panels, one semantic pair: blue vs orange, and every
   colour cue also carries text or shape. NFL team colour enters only as data
   (--tp / --ts painted per element), never as meaning. */
:root{
 /* chrome */
 --field:#0B1628; --endzone:#060E1A; --signal:#FF6A00; --sky:#2F7BFF;
 --chalk:#F5F2EA; --yard:#9BA7B0;
 /* panels */
 --card:#FFFFFF; --panel2:#F1EEE6; --zebra:#E9EEF7;
 --ink:#0B1410; --ink2:#3C4A44; --mute:#5A6580; --rule:#DED9CD; --rule2:#EDEAE1;
 --sky-bg:#DCE8FF; --sky-ink:#1A4FB3; --signal-bg:#FFE9D6; --signal-ink:#7A3300;
 --red:#D7191C;
 /* kept for the draft page, which was written against the old names */
 --paper:#0B1628; --band:#060E1A; --blue:#1A4FB3; --blue-bg:#DCE8FF;
 --amber:#7A3300; --amber-bg:#FFE9D6; --onblue:#FFFFFF; --onamber:#FFFFFF;
 --display:"Barlow Condensed",Impact,"Arial Narrow",sans-serif;
 --body:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
 --shadow:0 10px 30px -18px rgba(0,0,0,.8);
 --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--field)}
body{color:var(--chalk);font:15px/1.5 var(--body);font-variant-numeric:tabular-nums;
 -webkit-font-smoothing:antialiased;min-height:100vh;
 background:radial-gradient(1200px 500px at 50% -140px,rgba(255,106,0,.16),transparent 60%),
            linear-gradient(180deg,#0A1526 0%,var(--field) 40%,#09111C 100%);
 background-attachment:fixed}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 70px}
.band+.wrap{padding-top:22px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.dim{color:var(--mute)}
.b{font-weight:700}
[hidden]{display:none!important}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:20;background:rgba(6,14,26,.94);
 backdrop-filter:blur(10px) saturate(140%);padding-top:var(--safe-t);
 border-bottom:1px solid rgba(255,255,255,.08)}
.nav .wrap{display:flex;gap:2px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.nav .wrap::-webkit-scrollbar{display:none}
.nav a{font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;font-size:15px;
 font-weight:700;color:var(--yard);text-decoration:none;padding:14px 12px;white-space:nowrap;
 border-bottom:3px solid transparent}
.nav a:hover{color:#fff}
.nav a.on{color:#fff;border-bottom-color:var(--signal)}
.nav a:focus-visible{outline:2px solid var(--signal);outline-offset:-4px;border-radius:3px}
button.brand{display:flex;align-items:center;padding:0 13px 0 2px;flex:0 0 auto;
 background:none;border:none;cursor:pointer}
.brand img{display:block;width:22px;height:22px;border-radius:5px}
button.brand:focus-visible{outline:2px solid var(--signal);outline-offset:-2px;border-radius:5px}

/* ---------- hero band ---------- */
.band{background:transparent;color:var(--chalk)}
.band .wrap.hero{padding-top:22px;padding-bottom:18px;display:flex;align-items:center;
 justify-content:space-between;gap:22px}
.heroimg{display:block;height:118px;width:auto;border-radius:10px;flex:0 0 auto;
 box-shadow:0 3px 20px rgba(0,0,0,.5)}
@media(max-width:760px){.heroimg{height:92px}}
@media(max-width:520px){.heroimg{height:62px;border-radius:7px}}
@media(max-width:330px){.heroimg{display:none}}
h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,6.5vw,60px);line-height:1;
 margin:0;letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;
 letter-spacing:.05em;color:#fff;margin:30px 0 10px}
.wrap>h2:first-child{margin-top:6px}
h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:.02em}
h4{font-family:var(--display);font-weight:700;font-size:12px;text-transform:uppercase;
 letter-spacing:.11em;color:var(--ink2);margin:0 0 8px}
h4.mt{margin-top:18px}
a{color:var(--sky)}
a:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:3px}

/* ---------- panels ---------- */
.card{background:var(--card);color:var(--ink);border-radius:14px;padding:18px 20px;
 margin-bottom:14px;box-shadow:var(--shadow);overflow:hidden}
/* Every table on this site lives in a .scroll, and every table needs a light
   panel under it or the zebra rows vanish into the navy ground. Nested ones
   are already on a panel, so they drop the shadow and the radius. */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);color:var(--ink);
 border-radius:14px;box-shadow:var(--shadow);padding:2px 4px 4px}
.scroll table{width:100%}
.card .scroll,.fold .scroll,.wkbody .scroll,.mc .scroll{background:transparent;box-shadow:none;
 border-radius:0;padding:0}
.empty{background:var(--card);color:var(--ink2);border-radius:14px;padding:28px 22px;
 text-align:center;box-shadow:var(--shadow)}
.empty strong{display:block;font-family:var(--display);font-size:18px;color:var(--ink);
 text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media(max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:520px){.wrap{padding-left:14px;padding-right:14px}
 .card,.tile{padding:15px 14px}.band .wrap.hero{padding-top:18px;padding-bottom:16px}}

/* ---------- tiles ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cards.nav2{margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile{background:var(--card);color:var(--ink);border-radius:14px;padding:14px 16px;
 box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .lab{font-family:var(--display);font-size:11.5px;letter-spacing:.11em;
 text-transform:uppercase;color:var(--ink2);font-weight:700}
.tile .v{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1;margin-top:2px}
.tile .v2{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15;margin-top:3px}
.tile .s{font-size:12.5px;color:var(--mute);margin-top:2px}
.tile.lnk{display:block;text-decoration:none;color:var(--ink)}
.tile.lnk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
 background:var(--sky)}
.tile.lnk:hover::before{background:var(--signal)}
.tile.lnk:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.cta{display:inline-block;font-family:var(--display);text-transform:uppercase;letter-spacing:.09em;
 font-size:13px;font-weight:700;background:var(--sky);color:#fff;text-decoration:none;
 padding:10px 16px;border-radius:8px;margin-top:14px}

/* ---------- tags / pills ---------- */
.pill,.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--display);
 font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
 padding:4px 8px;border-radius:5px;border:1px solid var(--rule);background:var(--panel2);
 color:var(--ink2);white-space:nowrap;vertical-align:middle}
.pill.live,.tag.live{color:var(--signal-ink);background:var(--signal-bg);border-color:var(--signal)}
.pill.live::before,.tag.live::before{content:"";width:6px;height:6px;border-radius:50%;
 background:var(--signal);animation:pulse 1.4s ease-in-out infinite}
.tag.pre{color:var(--sky-ink);background:var(--sky-bg);border-color:var(--sky)}
.tag.final{color:var(--ink2);background:var(--panel2);border-color:var(--rule)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.pill.live::before,.tag.live::before{animation:none}}

/* ---------- team identity ---------- */
.tlogo{width:20px;height:20px;object-fit:contain;flex:none;display:block}
.tlogo.lg{width:40px;height:40px}
.shield{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:5px;
 font:800 8.5px/1 var(--display);letter-spacing:.04em;color:#fff;
 text-shadow:0 1px 1px rgba(0,0,0,.5);width:20px;height:20px;
 background:linear-gradient(160deg,var(--tp,#333) 55%,var(--ts,#777) 56%)}
.shield.lg{width:40px;height:40px;font-size:14px;border-radius:9px}
.head{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:top;flex:none;
 display:block;border:2px solid var(--tp,#334);
 background:linear-gradient(160deg,var(--tp,#334) 0%,var(--ts,#667) 100%)}
.head.sm{width:28px;height:28px}
.head.fb{display:flex;align-items:center;justify-content:center;font:800 11px var(--display);color:#fff}
.head.fb .tlogo{width:18px;height:18px}
.head.sm.fb .tlogo{width:16px;height:16px}
.tav{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;display:block;
 background:var(--panel2)}
.tav.lg{width:34px;height:34px}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--ink2);text-align:left;padding:10px;
 border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--rule2);vertical-align:middle;color:var(--ink)}
th.num,td.num{text-align:right;font-family:var(--display);font-size:16px;font-weight:700;
 font-variant-numeric:tabular-nums}
th.num{font-size:12px}
td.num.dim{font-weight:500;color:var(--mute)}
td.l{text-align:left}
.stand tbody tr:nth-child(odd),.rost tbody tr:nth-child(odd),
table.recap tbody tr:nth-child(odd){background:var(--zebra)}
.stand thead th:first-child{width:34px}
.rost thead th:first-child{width:46px}
@media(max-width:560px){th,td{padding:8px 6px}th{font-size:11px}
 th.num,td.num{font-size:15px}}
.rk{width:30px;font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink2)}
.tm{font-weight:600}
.tmc{display:flex;align-items:center;gap:9px;min-width:0}
.tmc .tn2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pp{font-family:var(--display);font-size:12px;letter-spacing:.06em;color:var(--ink2);
 text-transform:uppercase;white-space:nowrap}
.pl{display:flex;align-items:center;gap:8px;min-width:0}
.pl+.pl{margin-top:5px}
.pl .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.pl .head.sm{width:24px;height:24px}.pl{gap:6px}}
.inj{font:700 9.5px/1 var(--display);letter-spacing:.04em;color:var(--signal-ink);
 background:var(--signal-bg);padding:2px 3px;border-radius:3px;flex:none;margin-left:5px}
.h2h .inj{margin-left:0}
.rost .slot{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;
 color:var(--ink2);width:46px;text-transform:uppercase}
.rost tbody tr.sep{background:var(--panel2)}
.rost tbody tr.sep td{font-family:var(--display);text-transform:uppercase;letter-spacing:.13em;
 font-size:11px;font-weight:700;color:var(--ink2);padding:7px 11px;
 border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.rost tbody tr.sep+tr{background:transparent}

/* ---------- folds (teams, money) ---------- */
.fold{background:var(--card);color:var(--ink);border-radius:14px;margin:12px 0;
 box-shadow:var(--shadow);overflow:hidden}
.fold>summary{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;
 letter-spacing:.11em;color:var(--ink);padding:14px 18px;cursor:pointer;list-style:none;
 display:flex;align-items:center;gap:12px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:'+';font-family:var(--display);font-weight:400;font-size:22px;
 color:var(--ink2);line-height:1;margin-left:auto}
.fold[open]>summary::after{content:'\2212'}
.fold>summary:focus-visible{outline:3px solid var(--signal);outline-offset:-3px}
.fold>*:not(summary){padding:0 16px 16px}
.fold .empty{margin:0;box-shadow:none}
.fold>summary .tr{font-family:var(--display);font-weight:800;font-size:17px;color:var(--ink2);
 min-width:22px;display:inline-block}
.fold>summary .tn{font-family:var(--display);font-weight:700;font-size:22px;
 text-transform:none;letter-spacing:.01em;color:var(--ink)}
.fold>summary .sma{font-family:var(--body);font-weight:500;font-size:13.5px;letter-spacing:0;
 text-transform:none;color:var(--ink2);font-variant-numeric:tabular-nums}
@media(max-width:520px){.fold>summary{gap:9px;padding:13px 14px}
 .fold>summary .tn{font-size:18px}.fold>summary .sma{font-size:12.5px}}

/* ---------- matchup card ---------- */
.mc{background:var(--card);color:var(--ink);border-radius:14px;margin:0 0 12px;
 box-shadow:var(--shadow);overflow:hidden}
.mc>summary{list-style:none;cursor:pointer;padding:0}
.mc>summary::-webkit-details-marker{display:none}
.mc>summary:focus-visible{outline:3px solid var(--signal);outline-offset:-3px}
.mc .top{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
 align-items:center;gap:10px;padding:13px 14px 10px}
.mc .side{min-width:0}
.mc .side.r{text-align:right}
.mc .idr{display:flex;align-items:center;gap:8px;min-width:0}
.mc .side.r .idr{flex-direction:row-reverse}
.mc .side .n{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.02em;
 text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
 display:block;min-width:0}
.mc .side .rec{font-size:11.5px;color:var(--ink2);margin-top:3px}
.mc .sc{display:block;margin-top:3px;font-family:var(--display);font-weight:800;font-size:34px;
 line-height:1;font-variant-numeric:tabular-nums}
.mc .sc.trail{color:var(--mute)}
.mc .vs{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.12em;
 color:var(--mute)}
.mc .proj{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;
 padding:0 14px 10px;font-size:12px;color:var(--ink2)}
.mc .proj .r{text-align:right}
.mc .proj b{font-family:var(--display);font-size:15px;color:var(--ink);
 font-variant-numeric:tabular-nums}
.mc .wp{padding:0 14px 12px}
.mc .wp .lab{display:flex;justify-content:space-between;align-items:baseline;
 font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--ink2);margin-bottom:5px;gap:10px}
.mc .wp .lab span{text-align:center}
/* each number takes its end of the bar's colour; the side it sits on says whose */
.mc .wp .lab b{font-size:22px;font-weight:800;letter-spacing:0;line-height:1;
 font-variant-numeric:tabular-nums}
.mc .wp .lab b.a{color:var(--sky-ink)}
.mc .wp .lab b.b{color:var(--signal-ink)}
.mc .wpbar{height:9px;border-radius:999px;background:var(--panel2);overflow:hidden;display:flex}
.mc .wpbar i{display:block;height:100%;background:var(--sky);
 transition:width .8s cubic-bezier(.2,.8,.2,1)}
.mc .wpbar i+i{background:var(--signal);flex:1}
.mc .left{display:flex;justify-content:space-between;margin-top:5px;font-size:11.5px;
 color:var(--ink2);gap:10px}
.mc .left b{color:var(--ink)}
.mc .open{display:flex;justify-content:center;align-items:center;gap:6px;padding:7px 12px;
 border-top:1px solid var(--rule);font-family:var(--display);font-weight:700;font-size:11.5px;
 letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);background:var(--panel2)}
.mc[open] .open .more{display:none}
.mc:not([open]) .open .less{display:none}
@media (prefers-reduced-motion:reduce){.mc .wpbar i{transition:none}}
@media(max-width:520px){.mc .sc{font-size:28px}.mc .side .n{font-size:15px}
 .mc .top{gap:6px;padding:12px 11px 9px}.mc .proj,.mc .wp{padding-left:11px;padding-right:11px}}

/* ---------- NFL game cards ---------- */
.games{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:620px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}
.game{background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px 11px 18px;
 position:relative;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
/* the two team colours are identity, split down the left edge */
.game::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
 background:linear-gradient(180deg,var(--tp) 50%,var(--to) 50%)}
.game .t{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.game .t .ab{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;
 font-size:21px;letter-spacing:.04em;min-width:0}
.game .t .s{font-family:var(--display);font-weight:800;font-size:28px;
 font-variant-numeric:tabular-nums;flex:none}
.game .t.trail .s,.game .t.trail .ab{color:var(--mute)}
.game .fb{flex:none;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.game .poss{font-family:var(--display);font-weight:700;font-size:9.5px;letter-spacing:.08em;
 color:#1A0A00;background:var(--signal);padding:3px 5px;border-radius:4px;white-space:nowrap;
 text-transform:uppercase}
.game .st{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:8px;
 font-size:12.5px;color:var(--ink2);flex-wrap:wrap;text-align:right}
.game .st .clk{font-family:var(--display);font-weight:800;font-size:15px;color:var(--ink);
 font-variant-numeric:tabular-nums}
.game .st .tv{color:var(--mute)}
.game .st.sub{margin-top:3px;font-size:11.5px;color:var(--mute)}
/* the last snap, across the bottom of a live card */
.game .lp{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);font-size:12px;
 line-height:1.35;color:var(--ink2)}
.game .lp.scored{color:var(--ink)}
.game .lp .lpt{display:inline-block;font-family:var(--display);font-weight:800;font-size:10.5px;
 letter-spacing:.08em;text-transform:uppercase;color:var(--signal-ink);background:var(--signal-bg);
 padding:2px 5px;border-radius:3px;margin-right:6px;vertical-align:1px}

/* live is a ring plus the LIVE tag; red zone is a ring plus the words RED ZONE */
.game.live{box-shadow:var(--shadow),0 0 0 2px var(--signal)}
.game.live.rz{box-shadow:var(--shadow),0 0 0 2px var(--red)}
.game.live.rz .poss{background:var(--red);color:#fff}
@media(max-width:420px){.game{padding:11px 12px 10px 16px}
 .game .t .ab{font-size:19px;gap:7px}.game .t .s{font-size:25px}
 .game .tlogo.lg{width:34px;height:34px}}

/* ---------- head to head ---------- */
.h2h .r{display:grid;grid-template-columns:minmax(0,1fr) 46px minmax(0,1fr);
 align-items:stretch;border-top:1px solid var(--rule)}
.h2h .r:nth-child(even){background:var(--zebra)}
.h2h .r.hd,.h2h .r.ft{background:var(--panel2)}
.h2h .r.hd .c{font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.06em;
 text-transform:uppercase;color:var(--ink);padding:9px 10px;display:block;white-space:nowrap;
 overflow:hidden;text-overflow:ellipsis}
.h2h .r.ft .c{padding:9px 10px;display:flex;align-items:center;gap:8px}
.h2h .r.ft .c.them{justify-content:flex-end}
.h2h .r.ft .tot{font-family:var(--display);font-weight:800;font-size:22px;
 font-variant-numeric:tabular-nums}
.h2h .r.ft .tot.trail{color:var(--mute)}
.h2h .r.ft .tl{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--ink2)}
.h2h .c{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 13px;min-width:0;
 position:relative}
.h2h .c.them{flex-direction:row-reverse;text-align:right;padding:7px 13px 7px 8px}
.h2h .c .bar{position:absolute;top:0;bottom:0;width:6px;background:var(--mute);left:0}
.h2h .c.them .bar{left:auto;right:0}
.h2h .c.pre .bar{background:var(--sky)}
.h2h .c.live .bar{background:var(--signal)}
.h2h .c.live.rz .bar{background:var(--red)}
.h2h .c.done .bar{background:var(--mute)}
.h2h .c .t{min-width:0;flex:1}
/* the name truncates, the injury flag never does */
.h2h .c .nm{display:flex;align-items:center;gap:5px;font-weight:600;font-size:13px;
 line-height:1.15;color:var(--ink);min-width:0}
.h2h .c.them .nm{flex-direction:row-reverse}
.h2h .c .nm .pn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.h2h .c .nm.dim{color:var(--mute);font-weight:500}
/* the game line wraps rather than losing its first characters to a clip */
.h2h .c .sub{display:flex;align-items:center;gap:5px;margin-top:2px;font-size:11px;
 color:var(--ink2);flex-wrap:wrap}
.h2h .c.them .sub{justify-content:flex-end}
.h2h .c .sub span{min-width:0}
.h2h .c .sub .tlogo,.h2h .c .sub .shield{width:14px;height:14px}
.h2h .c.live .sub{color:var(--signal-ink);font-weight:600}
.h2h .c .v{text-align:right;flex:none}
.h2h .c.them .v{text-align:left}
.h2h .c .v b{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:1;
 font-variant-numeric:tabular-nums;color:var(--ink)}
.h2h .c.done .v b{color:var(--ink2)}
.h2h .c .v small{display:block;font-size:10px;color:var(--mute);font-variant-numeric:tabular-nums;
 margin-top:2px}
.h2h .mid{display:flex;align-items:center;justify-content:center;font-family:var(--display);
 font-weight:800;font-size:11px;letter-spacing:.06em;color:var(--ink2);background:var(--panel2);
 border-left:1px solid var(--rule);border-right:1px solid var(--rule);text-align:center}
/* every pixel here buys a character of the player's name */
@media(max-width:560px){.h2h .r{grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr)}
 .h2h .c{gap:5px;padding:7px 5px 7px 9px}.h2h .c.them{padding:7px 9px 7px 5px}
 .h2h .c .bar{width:5px}
 .h2h .c .v b{font-size:17px}.h2h .c .head.sm{width:24px;height:24px}
 .h2h .c .nm{font-size:12.5px}.h2h .c .sub{font-size:10.5px;gap:4px}
 .h2h .mid{font-size:10px}}

/* ---------- weekly results ---------- */
.wk{background:var(--card);color:var(--ink);border-radius:14px;margin:0 0 12px;
 box-shadow:var(--shadow);overflow:hidden}
.wk>summary{padding:15px 18px;cursor:pointer;list-style:none;display:flex;align-items:center;
 flex-wrap:wrap;gap:8px 14px}
.wk>summary::-webkit-details-marker{display:none}
.wk>summary:focus-visible{outline:3px solid var(--signal);outline-offset:-3px}
.wk>summary::after{content:'+';font-family:var(--display);font-weight:400;font-size:22px;
 color:var(--ink2);line-height:1;margin-left:auto}
.wk[open]>summary::after{content:'\2212'}
.wkh{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.03em;
 text-transform:uppercase}
.wkhi{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13.5px;
 color:var(--ink2)}
.wkn{font-size:14.5px;font-weight:600;color:var(--ink)}
.wkp{font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;
 color:var(--ink)}
.wkd{font-family:var(--display);font-weight:700;font-size:13px;color:var(--sky-ink);
 background:var(--sky-bg);padding:2px 9px;border-radius:4px}

@media(max-width:520px){.wkhi{gap:9px}.wkn,.wkp{font-size:14px}.wk>summary{padding:13px 14px}}

/* ---------- live header ---------- */
.livehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 margin:0 0 12px;padding:11px 14px;background:var(--card);color:var(--ink);border-radius:14px;
 box-shadow:var(--shadow)}
.lhl{display:flex;align-items:center;gap:10px}
.lhr{font-style:normal;font-size:12px;color:var(--mute)}
.lhhi{margin-left:auto;display:inline-flex;align-items:center;gap:12px}
.lhl2{font-family:var(--display);text-transform:uppercase;letter-spacing:.11em;font-size:11.5px;
 font-weight:700;color:var(--ink2)}
.lhn{font-size:14.5px;font-weight:600;color:var(--ink)}
.lhp{font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink);
 font-variant-numeric:tabular-nums}

/* ---------- recap ---------- */
.rlead{font-size:15.5px;line-height:1.6;color:var(--ink2);margin:0 0 14px;max-width:74ch}
.rlines{display:grid;margin-top:16px}
.rl{display:flex;gap:16px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule2)}
.rl:last-child{border-bottom:none}
.rll{font-family:var(--display);text-transform:uppercase;letter-spacing:.11em;font-size:11.5px;
 font-weight:700;color:var(--ink2);min-width:200px;flex:0 0 auto}
.rlv{font-size:14.5px;color:var(--ink)}
table.recap .tm{font-weight:700}
@media(max-width:600px){.rl{flex-direction:column;gap:2px}.rll{min-width:0}}

/* ---------- draft page (light card ground, old variable names) ---------- */
.grade{font-family:var(--display);font-weight:800;font-size:16px;padding:3px 9px;border-radius:4px;
 display:inline-block;min-width:42px;text-align:center}
.gA{background:var(--sky);color:#fff}
.gB{background:var(--sky-bg);color:var(--sky-ink)}
.gC{background:var(--signal-bg);color:var(--signal-ink)}
.gD{background:var(--signal);color:#1A0A00}
.pvw{background:var(--signal-bg);border-left:3px solid var(--signal);border-radius:0 8px 8px 0;
 padding:11px 15px;margin:0 0 18px;font-size:14px;color:var(--ink2)}
.pvw b{color:var(--ink)}
.kick{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:12px;
 font-weight:700;color:var(--signal);margin:0 0 10px}
.dek{font-size:17px;line-height:1.5;color:#C9CEDA;max-width:68ch;margin:12px 0 0}
.dek b{color:#fff}

/* ---------- champs lightbox ---------- */
#champ{position:fixed;inset:0;z-index:999;background:rgba(4,7,14,.94);display:flex;
 align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
#champ[hidden]{display:none}
#champ img{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:8px;
 box-shadow:0 10px 60px rgba(0,0,0,.7)}

/* ---------- scoring plays (on the card and in the game sheet) ---------- */
.game{cursor:pointer}
.game:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.scoring{margin-top:8px;padding-top:6px;border-top:1px solid var(--rule);font-size:12px}
.scoring .sh{display:grid;grid-template-columns:minmax(0,1fr) 30px 30px;gap:0 8px;align-items:baseline;padding:0 0 4px}
.scoring .sh .lab{font:800 10.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.scoring .sh .col{font:800 11px/1 var(--display);letter-spacing:.05em;text-align:right;color:var(--ink2)}
.scoring .q{font:700 10.5px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);padding:8px 0 3px;border-top:1px solid var(--rule)}
.scoring .more{font:600 11px var(--body);color:var(--mute);padding:2px 0 4px}
.scoring .sp{display:grid;grid-template-columns:20px minmax(0,1fr) 30px 30px;gap:0 8px;align-items:center;padding:5px 0;border-top:1px solid var(--rule)}
.scoring .sp:first-of-type{border-top:0}
.scoring .sp .w{min-width:0}
.scoring .sp .k{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.scoring .sp .k b{font:800 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.scoring .sp .k span{font:600 10.5px var(--body);color:var(--mute);font-variant-numeric:tabular-nums}
.scoring .sp .tx{font:500 12px/1.3 var(--body);color:var(--ink2);margin-top:1px}
.scoring .sp .dr{font:500 10.5px var(--body);color:var(--mute);margin-top:1px}
.scoring .sp .sc{font:800 17px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right;color:var(--yard)}
.scoring .sp .sc.on{color:var(--ink)}

.sheet{width:100%;max-width:720px;max-height:88vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:20px 20px 0 0;
